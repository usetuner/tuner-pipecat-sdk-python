name: Publish

# Every merge to main lands here. The job only publishes when the version in
# pyproject.toml is not already on PyPI, so ordinary merges are a no-op and a
# merge that bumps the version releases it. PyPI rejects a re-upload of an
# existing version, so the check is what keeps the workflow green.
on:
  push:
    branches: [main]

# Read-only by default; the publish job widens this for itself.
permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should-publish: ${{ steps.version.outputs.should-publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version and compare with PyPI
        id: version
        run: |
          set -euo pipefail
          name=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["name"])')
          version=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$name/$version/json")
          if [ "$status" = "200" ]; then
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$name $version is already on PyPI - nothing to publish."
          else
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing $name $version."
          fi

  publish:
    name: Build and publish
    needs: check
    if: needs.check.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tuner-pipecat-sdk
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC) - no API token needed
      contents: write   # push the release tag
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Run tests
        run: |
          uv sync --extra test
          uv run pytest

      - name: Build sdist and wheel
        run: |
          rm -rf dist/
          uv build

      - name: Validate metadata
        run: uvx twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Tag the release
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: gh release create "v$VERSION" dist/* --title "v$VERSION" --generate-notes
